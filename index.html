    <title>Movieverse | Cinema atlas</title>
    <style>
      :root {
        color: #ecf0e5;
        background: #10120e;
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        --panel: #171a14;
        --field: #121610;
        --hover: #23291e;
        --line: #343b2e;
        --edge: #51594a;
        --muted: #acb5a4;
        --signal: #e0ef9c;
        --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 280px;
        margin: 0;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      button,
      input,
      select {
        min-height: 44px;
        color: inherit;
        border: 1px solid var(--edge);
        border-radius: 2px;
        background: var(--field);
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: var(--hover);
      }
      :focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 2px;
      }
      .shell {
        max-width: 1520px;
        margin: auto;
        padding-inline: max(14px, env(safe-area-inset-left))
          max(14px, env(safe-area-inset-right));
      }
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 9px 20px;
        padding: max(16px, env(safe-area-inset-top)) 0 16px;
        border-bottom: 1px solid var(--edge);
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      h1 {
        font: 700 clamp(1.35rem, 3.1vw, 2rem)/1.05 var(--mono);
        letter-spacing: -0.075em;
      }
      .aperture {
        display: grid;
        place-items: center;
        width: 25px;
        aspect-ratio: 1;
        border: 1px solid var(--signal);
        color: var(--signal);
      }
      .aperture:before {
        content: "";
        width: 13px;
        height: 13px;
        background: currentColor;
        clip-path: polygon(
          0 14%,
          14% 0,
          50% 36%,
          86% 0,
          100% 14%,
          64% 50%,
          100% 86%,
          86% 100%,
          50% 64%,
          14% 100%,
          0 86%,
          36% 50%
        );
      }
      .catalog-status {
        color: var(--muted);
        font: 0.68rem/1.4 var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.035em;
      }
      .catalog-status span {
        color: #859473;
        padding-inline: 3px;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        padding-block: 14px max(18px, env(safe-area-inset-bottom));
      }
      .map-stack {
        min-width: 0;
      }
      .map-area,
      .search-panel,
      .details {
        min-width: 0;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .map-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 47px;
        padding-left: 12px;
        border-bottom: 1px solid var(--line);
      }
      .map-bar h2 {
        color: var(--signal);
        font: 600 0.72rem/1.3 var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .map-controls {
        display: flex;
        align-items: center;
      }
      .map-scale {
        min-width: 52px;
        padding-inline: 6px;
        color: var(--muted);
        text-align: center;
        font: 0.72rem var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .map-controls button {
        width: 44px;
        border: 0;
        border-left: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        color: var(--signal);
        font: 1.12rem var(--mono);
      }
      .map-controls button:hover {
        background: var(--hover);
      }
      .map-controls button:focus-visible {
        outline-offset: -3px;
      }
      .map-controls .map-reset {
        width: 52px;
        font-size: 0.72rem;
      }
      .map-field {
        height: clamp(315px, 50svh, 530px);
        position: relative;
        background: var(--field);
      }
      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas:focus-visible {
        outline-offset: -3px;
      }
      canvas:active {
        cursor: grabbing;
      }
      .map-help {
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font: 0.7rem/1.5 var(--mono);
      }
      .desktop-help {
        display: none;
      }
      .legend {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px 16px;
        padding: 12px;
        border-top: 1px solid var(--line);
        font: 0.71rem/1.35 var(--mono);
      }
      .legend > span {
        color: var(--muted);
      }
      .legend ul {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .marker {
        display: inline-block;
        flex: none;
        width: 8px;
        height: 8px;
        background: currentColor;
      }
      .marker[data-shape="circle"] {
        border-radius: 50%;
      }
      .marker[data-shape="ring"] {
        border: 1px solid currentColor;
        border-radius: 50%;
        background: transparent;
      }
      .marker[data-shape="diamond"] {
        transform: rotate(45deg) scale(0.78);
      }
      .marker[data-shape="plus"] {
        clip-path: polygon(
          36% 0,
          64% 0,
          64% 36%,
          100% 36%,
          100% 64%,
          64% 64%,
          64% 100%,
          36% 100%,
          36% 64%,
          0 64%,
          0 36%,
          36% 36%
        );
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .search-panel,
      .details {
        padding: 14px;
      }
      .panel-title,
      .detail-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }
      h2 {
        font-size: 1.23rem;
        font-weight: 650;
        line-height: 1.2;
        letter-spacing: -0.026em;
      }
      .result-count {
        color: var(--signal);
        white-space: nowrap;
        font: 0.7rem var(--mono);
      }
      .search-label,
      .filters label,
      dt {
        color: var(--muted);
        font: 0.72rem/1.3 var(--mono);
      }
      input,
      select {
        display: block;
        width: 100%;
        min-width: 0;
        margin-top: 5px;
        padding: 0 9px;
        font-size: 1rem;
      }
      input::placeholder {
        color: #929d8d;
      }
      .search-field {
        position: relative;
      }
      .search-field input {
        padding-left: 31px;
      }
      .search-field:before {
        content: "";
        position: absolute;
        left: 11px;
        top: 15px;
        width: 10px;
        height: 10px;
        border: 1px solid var(--muted);
        border-radius: 50%;
        pointer-events: none;
      }
      .search-field:after {
        content: "";
        position: absolute;
        left: 19px;
        top: 24px;
        width: 6px;
        height: 1px;
        background: var(--muted);
        transform: rotate(45deg);
        pointer-events: none;
      }
      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .films {
        margin: 14px -3px -3px;
        padding: 3px;
        max-height: 315px;
        overflow-y: auto;
        list-style: none;
        scrollbar-color: var(--edge) transparent;
      }
      .films li {
        border-top: 1px solid var(--line);
      }
      .films button {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 49px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        background: transparent;
        text-align: left;
      }
      .films button:hover {
        background: var(--hover);
      }
      .films button:focus-visible {
        outline-offset: -2px;
      }
      .films button[aria-pressed="true"] {
        box-shadow: inset 2px 0 var(--signal);
        background: var(--hover);
      }
      .films strong,
      .films small {
        display: block;
      }
      .films strong {
        font-size: 0.89rem;
        font-weight: 580;
      }
      .films small,
      .film-year {
        color: var(--muted);
        font: 0.7rem/1.4 var(--mono);
      }
      .film-year {
        margin-left: auto;
        text-align: right;
      }
      .details {
        border-top: 2px solid var(--signal);
        scroll-margin-top: 12px;
      }
      .kicker {
        margin-bottom: 5px;
        color: var(--signal);
        font: 0.7rem var(--mono);
        text-transform: uppercase;
      }
      .close {
        min-width: 44px;
        font-size: 1.2rem;
      }
      dl {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
      }
      dd {
        margin: 4px 0 0;
        font-size: 0.82rem;
        overflow-wrap: anywhere;
      }
      dd a {
        color: var(--signal);
      }
      .detail-wide {
        grid-column: 1 / -1;
      }
      .atlas-caption,
      .status,
      .empty {
        color: var(--muted);
        font-size: 0.79rem;
        line-height: 1.5;
      }
      .atlas-caption {
        padding: 9px 0 0;
      }
      .status,
      .empty {
        padding-block: 14px;
      }
      .empty button,
      .status button {
        margin-top: 8px;
        padding-inline: 12px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @media (min-width: 850px) {
        .shell {
          padding-inline: 24px;
        }
        .masthead {
          padding-block: max(20px, env(safe-area-inset-top)) 20px;
        }
        .workspace {
          grid-template-columns: minmax(250px, 305px) minmax(0, 1fr);
          gap: 12px 16px;
          align-items: start;
          padding-top: 18px;
        }
        .sidebar {
          grid-row: 1;
          grid-column: 1;
        }
        .search-panel {
          order: -1;
        }
        .map-stack {
          grid-row: 1;
          grid-column: 2;
        }
        .map-field {
          height: clamp(365px, calc(100svh - 224px), 840px);
        }
        .films {
          max-height: clamp(245px, calc(100svh - 330px), 680px);
        }
      }
      @media (min-width: 850px) and (hover: hover) and (pointer: fine) {
        .desktop-help {
          display: inline;
        }
        .touch-help {
          display: none;
        }
      }
    </style>
